<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="GsDl2oMUxBjgeajHA3zRRhV_5tGIkmaktQnkN1IDfnw" />
  {% seo %}
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/sa-favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/sa-favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/sa-apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <nav class="site-nav">
    <a class="prompt" href="{{ '/' | relative_url }}">0trc@sasecurityn<span class="tilde">:~</span>$<span class="cursor" aria-hidden="true"></span></a>
    <div class="nav-links">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a>
      <a href="{{ '/posts/' | relative_url }}"{% if page.url contains '/posts' or page.categories contains 'posts' %} class="active"{% endif %}>Posts</a>
      <a href="{{ '/reviews/' | relative_url }}"{% if page.url contains '/reviews' or page.categories contains 'reviews' %} class="active"{% endif %}>Reviews</a>
      <a href="{{ '/creations/' | relative_url }}"{% if page.url contains '/creations' or page.categories contains 'creations' %} class="active"{% endif %}>Creations</a>
    </div>
  </nav>
  <header class="site-header">
    <p class="site-tag{% if page.url == '/' %} site-tag--home{% endif %}">{{ site.description }}</p>
  </header>
  <main class="content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <span>© {{ 'now' | date: "%Y" }} Said-Abbosxon Nabijonov</span>
  </footer>
</body>
</html>
